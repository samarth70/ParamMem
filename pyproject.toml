[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "param_mem"
version = "0.1.0"
description = "Parametric Reflective Memory Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "bitsandbytes>=0.43.0",
    "gradio>=4.20.0",
    "accelerate>=0.29.0",
    "datasets>=2.19.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["src"]
